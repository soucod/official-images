# CNB 手动触发按钮配置
# 文档: https://docs.cnb.cool/zh/build/web-trigger.html

branch:
  # 匹配所有分支
  - reg: ".*"
    buttons:
      # 按钮 1: 同步单个镜像
      - name: 🔄 同步单个镜像
        description: 同步指定的 Docker 镜像到 CNB 仓库
        event: web_trigger_sync_single_image
        inputs:
          IMAGE_NAME:
            name: 镜像名称
            description: 镜像名称 (不含平台前缀和标签)
            placeholder: nginx 或 library/mysql
            required: true
            type: input
          IMAGE_TAG:
            name: 镜像标签
            description: 镜像标签
            placeholder: latest
            default: latest
            required: false
            type: input
          IMAGE_ARCH:
            name: 镜像架构
            description: 镜像架构
            type: select
            default: amd64
            options:
              - label: x86_64 (amd64)
                value: amd64
              - label: ARM64 (arm64)
                value: arm64
          IMAGE_PLATFORM:
            name: 源镜像平台
            description: 源镜像平台
            type: select
            default: docker.io
            options:
              - label: Docker Hub
                value: docker.io
              - label: GitHub Container Registry
                value: ghcr.io
              - label: Quay.io
                value: quay.io

      # 按钮 2: 同步 docker-images.txt 全部镜像
      - name: 📦 同步 docker-images.txt 全部镜像
        description: 批量同步 docker-images.txt 中的所有镜像并生成 Issue 报告
        event: web_trigger_sync_all_images
        inputs:
          SYNC_ARCH:
            name: 镜像架构
            type: select
            default: amd64
            options:
              - label: x86_64 (amd64)
                value: amd64
              - label: ARM64 (arm64)
                value: arm64

      # 按钮 3: 同步指定文件
      - name: 📄 同步指定文件镜像
        description: 同步指定文本文件中列出的镜像清单
        event: web_trigger_sync_from_custom_file
        inputs:
          CUSTOM_FILE:
            name: 文件路径
            description: 镜像列表文件路径
            placeholder: docker-images.txt
            default: docker-images.txt
            required: true
            type: input
          SYNC_ARCH:
            name: 镜像架构
            type: select
            default: amd64
            options:
              - label: x86_64 (amd64)
                value: amd64
              - label: ARM64 (arm64)
                value: arm64

      # 按钮 4: 同步 library 单个官方镜像
      - name: 📚 同步 library 单个官方镜像
        description: 同步 library 目录中指定的官方镜像
        event: web_trigger_sync_library_image
        inputs:
          LIB_IMAGE_NAME:
            name: 官方镜像名称
            description: library 目录中的文件名 (如 openjdk, nginx, alpine)
            placeholder: openjdk
            required: true
            type: input
          VERSION_COUNT:
            name: 版本数量
            description: 同步最近几个主版本
            type: select
            default: "3"
            options:
              - label: 最近 3 个主版本
                value: "3"
              - label: 最近 5 个主版本
                value: "5"
              - label: 最近 10 个主版本
                value: "10"
          SYNC_ARCH:
            name: 镜像架构
            type: select
            default: amd64
            options:
              - label: x86_64 (amd64)
                value: amd64
              - label: ARM64 (arm64)
                value: arm64

      # 按钮 5: 全量同步 library 所有官方镜像
      - name: 🚀 全量同步 library 所有官方镜像
        description: 遍历同步 library 目录下全部 141 个官方镜像 (各最近3个版本)
        event: web_trigger_sync_all_library
        inputs:
          VERSION_COUNT:
            name: 每个镜像的版本数
            type: select
            default: "3"
            options:
              - label: 最近 1 个版本 (最快)
                value: "1"
              - label: 最近 3 个版本 (推荐)
                value: "3"
              - label: 最近 5 个版本
                value: "5"
          SYNC_ARCH:
            name: 镜像架构
            type: select
            default: amd64
            options:
              - label: x86_64 (amd64)
                value: amd64
              - label: ARM64 (arm64)
                value: arm64
